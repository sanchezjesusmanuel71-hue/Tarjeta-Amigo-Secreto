<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo secreto</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<input type="radio" name="paso" id="paso1" class="oculto" checked>
<input type="radio" name="paso" id="paso2" class="oculto">

<div class="contenedor">


  <section class="pagina pagina-1">
    <div class="etiqueta">Intercambio de regalos</div>

    <div class="icono-envoltorio">
      <div class="icono-brillo"></div>
      <div class="icono">🎁</div>
    </div>

    <h1 class="titulo">¿Descubriremos al amigo secreto?</h1>
    <p class="subtitulo">En un momento sabrás a la persona secreta.</p>

    <label for="paso2" class="boton">Revelar 🎁</label>
  </section>


  <section class="pagina pagina-2">
    <div class="etiqueta">Intercambio de regalos</div>
    <h1 class="titulo titulo-pequeño">Toca la caja y descubre el nombre de la persona secreta</h1>

    <input type="checkbox" id="abrir" class="oculto">
    <label for="abrir">
      <div class="caja-envoltorio">
        <div class="brillo"></div>
        <div class="caja">
          <div class="cuerpo-caja">
            <div class="liston-cuerpo"></div>
            
          </div>
          <div class="tapa">
            <div class="liston"></div>
          </div>
          </div>
          <div class="contenido">
        <div class="nombre">Jhoan Perez</div>
        </div>
          </div>
    </label>
    <p class="ayuda">Toca la caja para abrirla</p>
  </section>

</div>
</body>
</html>
